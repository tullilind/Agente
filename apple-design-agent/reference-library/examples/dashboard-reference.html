<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ATLAS Apple Dashboard Reference</title>
  <link rel="stylesheet" href="../tokens/semantic-tokens.css">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:var(--atlas-apple-font);
      color:var(--atlas-apple-text);
      background:var(--atlas-apple-bg);
      display:grid;
      grid-template-columns:280px minmax(0,1fr);
    }
    aside{
      padding:24px 16px;
      border-right:1px solid var(--atlas-apple-separator);
    }
    main{min-width:0}
    .toolbar{
      position:sticky;top:0;z-index:10;
      min-height:64px;
      display:flex;align-items:center;justify-content:space-between;
      padding:10px 24px;
      border-bottom:1px solid var(--atlas-apple-separator);
    }
    .content{max-width:1200px;margin:auto;padding:32px 24px}
    .title{font-size:34px;line-height:1.08;letter-spacing:-.03em;margin:0 0 24px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .card{
      border-radius:var(--atlas-apple-radius-card);
      border:1px solid var(--atlas-apple-separator);
      background:var(--atlas-apple-surface);
      padding:20px;
    }
    .metric{font-size:28px;font-weight:700;margin-top:8px}
    .muted{color:var(--atlas-apple-text-secondary);font-size:13px}
    button{
      border:0;
      background:var(--atlas-apple-accent);
      color:white;
      padding:0 16px;
      cursor:pointer;
      font-weight:600;
    }
    nav a{
      min-height:44px;
      display:flex;align-items:center;
      padding:0 12px;
      border-radius:10px;
      color:inherit;text-decoration:none;
    }
    nav a[aria-current="page"]{background:var(--atlas-apple-surface)}
    @media(max-width:800px){
      body{display:block}
      aside{display:none}
      .grid{grid-template-columns:1fr}
      .content{padding:24px 16px}
    }
  </style>
</head>
<body>
  <aside class="atlas-apple-glass">
    <strong>ATLAS</strong>
    <nav>
      <a href="#" aria-current="page">Visão geral</a>
      <a href="#">Pedidos</a>
      <a href="#">Clientes</a>
      <a href="#">Relatórios</a>
    </nav>
  </aside>

  <main>
    <header class="toolbar atlas-apple-glass">
      <strong>Painel</strong>
      <button class="atlas-apple-control">Nova ação</button>
    </header>

    <section class="content">
      <h1 class="title">Visão geral</h1>
      <div class="grid">
        <article class="card">
          <div class="muted">Receita</div>
          <div class="metric">R$ 42.890</div>
        </article>
        <article class="card">
          <div class="muted">Pedidos</div>
          <div class="metric">318</div>
        </article>
        <article class="card">
          <div class="muted">Conversão</div>
          <div class="metric">8,4%</div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
