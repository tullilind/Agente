<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../tokens/semantic-tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--atlas-apple-font);background:var(--atlas-apple-bg);color:var(--atlas-apple-text);display:grid;grid-template-columns:280px 1fr}
.sidebar{padding:18px 12px;border-right:1px solid var(--atlas-apple-separator)}
.sidebar nav{display:grid;gap:4px;margin-top:18px}
.sidebar a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:10px;color:inherit;text-decoration:none}
.sidebar a[aria-current="page"]{background:var(--atlas-apple-surface)}
.main{min-width:0}
.toolbar{min-height:64px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--atlas-apple-separator)}
.content{max-width:1100px;margin:auto;padding:32px 24px}
@media(max-width:760px){body{display:block}.sidebar{display:none}.content{padding:24px 16px}}
</style>
</head>
<body>
<aside class="sidebar atlas-apple-glass">
  <strong>Produto</strong>
  <nav aria-label="Navegação principal">
    <a href="#" aria-current="page">Visão geral</a>
    <a href="#">Itens</a>
    <a href="#">Relatórios</a>
    <a href="#">Configurações</a>
  </nav>
</aside>
<main class="main">
  <header class="toolbar atlas-apple-glass">
    <strong>Visão geral</strong>
    <button class="atlas-apple-control">Nova ação</button>
  </header>
  <section class="content">
    <h1>Conteúdo primeiro</h1>
    <p>A navegação fica disponível sem competir com o conteúdo principal.</p>
  </section>
</main>
</body>
</html>
