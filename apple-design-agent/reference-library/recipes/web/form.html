<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../tokens/semantic-tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:var(--atlas-apple-font);background:var(--atlas-apple-bg);color:var(--atlas-apple-text)}
form{width:min(460px,100%);background:var(--atlas-apple-surface);border:1px solid var(--atlas-apple-separator);border-radius:24px;padding:28px}
.group{display:grid;gap:7px;margin:18px 0}
label{font-size:13px;font-weight:600}
input{min-height:44px;border-radius:12px;border:1px solid var(--atlas-apple-separator);background:var(--atlas-apple-bg);color:inherit;padding:0 12px;font:inherit}
input:focus{outline:3px solid color-mix(in srgb,var(--atlas-apple-accent) 24%,transparent);border-color:var(--atlas-apple-accent)}
.help{font-size:12px;color:var(--atlas-apple-text-secondary)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
button{min-height:44px;border-radius:12px;padding:0 16px;font:600 15px var(--atlas-apple-font);cursor:pointer}
.primary{border:0;background:var(--atlas-apple-accent);color:#fff}
.secondary{border:1px solid var(--atlas-apple-separator);background:var(--atlas-apple-surface);color:inherit}
</style>
</head>
<body>
<form>
  <h1>Dados da conta</h1>
  <p>Peça apenas o necessário e explique erros junto ao campo.</p>
  <div class="group">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="nome@exemplo.com">
    <span class="help">Usado para identificação e recuperação de acesso.</span>
  </div>
  <div class="group">
    <label for="password">Senha</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>
  <div class="actions">
    <button class="secondary" type="button">Cancelar</button>
    <button class="primary" type="submit">Continuar</button>
  </div>
</form>
</body>
</html>
