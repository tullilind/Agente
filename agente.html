<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Agente IA - Conversacional</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
        body { background-color: #ffffff; color: #343541; height: 100vh; display: flex; overflow: hidden; }

        /* ==========================================
           1. SIDEBAR (Apenas o Agente)
           ========================================== */
        .sidebar { 
            width: 280px; background-color: #f7f7f8; border-right: 1px solid #e5e5e5; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .agente-container { text-align: center; }
        
        #agente {
            width: 120px; height: 120px; position: relative; margin: 0 auto;
            background: linear-gradient(135deg, #00C853 0%, #2196F3 50%, #ffffff 100%);
            border-radius: 24px; border: 4px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex; justify-content: space-evenly; align-items: center; transition: all 0.3s ease;
        }

        /* Animação de respiração do agente */
        @keyframes respirar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .respirando { animation: respirar 3s infinite ease-in-out; }

        .olho { width: 30px; height: 30px; background-color: white; border-radius: 50%; position: relative; border: 3px solid #333; overflow: hidden; }
        .pupila { width: 14px; height: 14px; background-color: #000; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: transform 0.2s ease-out; }

        .agente-status { margin-top: 20px; font-weight: 800; color: #4a5568; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .agente-humor { font-size: 14px; color: #718096; font-weight: 600; margin-top: 5px; }

        /* ==========================================
           2. ÁREA PRINCIPAL (O Chat)
           ========================================== */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; background: #ffffff; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid #e5e5e5; background: #fff; z-index: 10; }
        header h2 { font-size: 18px; font-weight: 800; color: #2c3e50; }
        .header-botoes { display: flex; gap: 10px; }
        .btn-icon { background: white; border: 1px solid #e5e5e5; padding: 8px; border-radius: 8px; cursor: pointer; color: #4a5568; transition: 0.2s; display: flex; }
        .btn-icon:hover { background: #f7f7f8; }

        .historico-chat { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
        
        .mensagem-linha { display: flex; gap: 15px; width: 100%; }
        .msg-direita { justify-content: flex-end; }
        
        .avatar-chat { width: 36px; height: 36px; border-radius: 8px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; font-weight: bold; color: white; }
        .avatar-agente { background: linear-gradient(135deg, #00C853 0%, #2196F3 100%); }
        .avatar-user { background: #5436DA; }

        .mensagem-balao { max-width: 80%; padding: 12px 18px; font-size: 16px; line-height: 1.6; font-weight: 600; border-radius: 12px; }
        .balao-agente { background: transparent; color: #343541; padding-left: 0; }
        .balao-user { background: #f3f3f3; color: #343541; border-bottom-right-radius: 4px; }
        .msg-sistema { background: #fff3cd; color: #856404; align-self: center; font-size: 13px; padding: 8px 15px; border-radius: 20px; margin: 10px 0; }

        .input-wrapper { padding: 30px 15%; background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 40%); position: sticky; bottom: 0; }
        .input-chat-box { display: flex; background: #fff; border: 1px solid #e5e5e5; border-radius: 24px; padding: 10px 15px; box-shadow: 0 0 15px rgba(0,0,0,0.05); align-items: center; gap: 10px; }
        .input-chat-box input { flex: 1; border: none; outline: none; font-size: 16px; padding: 10px; background: transparent; }
        .btn-enviar { background: #00C853; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .btn-enviar:hover { background: #009624; transform: scale(1.05); }

        /* ==========================================
           3. MODAL DE CONFIGURAÇÕES
           ========================================== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; width: 90%; max-width: 500px; border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-content h2 { margin-bottom: 20px; color: #2d3748; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #4a5568; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #edf2f7; border-radius: 12px; outline: none; font-family: 'Nunito', sans-serif; }
        .btn-full { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-save { background: #00C853; color: white; }

        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 200px; border-right: none; border-bottom: 1px solid #e5e5e5; flex-direction: row; }
            .agente-container { padding: 10px; }
            #agente { width: 80px; height: 80px; }
            .olho { width: 20px; height: 20px; }
            .pupila { width: 10px; height: 10px; }
            .historico-chat { padding: 20px 15px; }
            .input-wrapper { padding: 15px; }
        }
    </style>
</head>
<body id="pagina-agente">

    <div class="sidebar">
        <div class="agente-container">
            <div id="agente" class="respirando">
                <div class="olho"><div class="pupila" id="pupila-esq"></div></div>
                <div class="olho"><div class="pupila" id="pupila-dir"></div></div>
            </div>
            <div class="agente-status">
                <span class="material-symbols-outlined" style="color: #00C853; font-size: 20px;">check_circle</span> Online
            </div>
            <div class="agente-humor" id="status-humor">Pronto para conversar!</div>
        </div>
    </div>

    <div class="main-chat">
        <header>
            <h2>Meu Agente Conversacional</h2>
            <div class="header-botoes">
                <div id="btn-config" class="btn-icon" title="Configurações"><span class="material-symbols-outlined">settings</span></div>
                <div id="btn-travar" class="btn-icon" title="Sair" style="color: #e53e3e;"><span class="material-symbols-outlined">logout</span></div>
            </div>
        </header>

        <div class="historico-chat" id="chat-box"></div>

        <div class="input-wrapper">
            <div class="input-chat-box">
                <input type="text" id="input-mensagem" placeholder="Peça para eu anotar algo, ver o clima ou só conversar...">
                <button id="btn-enviar" class="btn-enviar"><span class="material-symbols-outlined" style="font-size: 20px;">arrow_upward</span></button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-config">
        <div class="modal-content">
            <h2>Configurações da IA</h2>
            <div class="form-group">
                <label>Chave API (Groq)</label>
                <input type="password" id="config-api-key" placeholder="gsk_...">
            </div>
            <div class="form-group">
                <label>System Prompt (Personalidade)</label>
                <textarea id="config-prompt" rows="3">Você é um assistente virtual super inteligente. Você anota tarefas e finanças do usuário sem que ele precise ver tabelas chatas, sempre avisando no chat de forma natural. Indique seu humor atual na conversa.</textarea>
            </div>
            <button id="btn-salvar-config" class="btn-full btn-save">Salvar</button>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <button id="btn-exportar" class="btn-full" style="background: #2d3748; color: white;"><span class="material-symbols-outlined">download</span> Exportar Backup (Memória)</button>
            <input type="file" id="input-importar" style="display: none;" accept=".json">
            <button id="btn-importar-trigger" class="btn-full" style="background: #f7f7f8; color: #2d3748; border: 1px solid #e5e5e5;"><span class="material-symbols-outlined">upload</span> Importar Backup</button>
            
            <button id="btn-fechar-modal" class="btn-full" style="background: transparent; color: #718096;">Fechar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
